global:
  scrape_interval: 60s
  evaluation_interval: 60s

scrape_configs:

  # Fishing & Tide Exporter — runs as systemd service on the Docker host
  # Metrics port: 9877  |  On-demand query port: 9878
  - job_name: fishing_exporter
    static_configs:
      # host.docker.internal does not resolve on Linux Docker — use your host's actual IP.
      # On Mac/Windows Docker Desktop, host.docker.internal works fine.
      - targets: ['10.0.0.13:9877']  # change to your host IP
        labels:
          instance: fishing-host

  # Fish Logger app metrics (if you add /metrics later)
  # - job_name: fish_logger
  #   static_configs:
  #     - targets: ['fish-logger:9879']
