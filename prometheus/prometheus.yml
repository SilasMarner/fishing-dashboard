global:
  scrape_interval: 60s
  evaluation_interval: 60s

scrape_configs:

  # Fishing & Tide Exporter — runs as its own container (see docker-compose.yml)
  # Metrics port: 9877  |  On-demand query port: 9878
  - job_name: fishing_exporter
    static_configs:
      - targets: ['fishing-exporter:9877']
        labels:
          instance: fishing-host

  # Fish Logger app metrics (if you add /metrics later)
  # - job_name: fish_logger
  #   static_configs:
  #     - targets: ['fish-logger:9879']
