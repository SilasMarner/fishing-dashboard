<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fish Logger{% block title %}{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body { background: #0d1117; color: #e6edf3; }
    .navbar { background: #161b22 !important; border-bottom: 1px solid #30363d; }
    .card  { background: #161b22; border: 1px solid #30363d; }
    .card-header { background: #1c2128; border-bottom: 1px solid #30363d; }
    .form-control, .form-select { background: #0d1117; border-color: #30363d; color: #e6edf3; }
    .form-control:focus, .form-select:focus { background: #0d1117; color: #e6edf3; border-color: #58a6ff; box-shadow: 0 0 0 .2rem rgba(88,166,255,.25); }
    .table { color: #e6edf3; }
    .table-dark { --bs-table-bg: #161b22; --bs-table-border-color: #30363d; }
    .badge-caught   { background: #1f6335; }
    .badge-skunked  { background: #6e1c1c; }
    .condition-pill { font-size:.75rem; padding:.25rem .6rem; border-radius:1rem; background:#1c2128; border:1px solid #30363d; }
    .nav-pills .nav-link.active { background: #1f6feb; }
    .nav-pills .nav-link { color: #8b949e; }
    .analysis-body { white-space: pre-wrap; font-family: inherit; font-size:.9rem; line-height:1.6; }
    .score-badge { font-size:1.2rem; font-weight:700; }
  </style>
</head>
<body>
<nav class="navbar navbar-dark mb-4">
  <div class="container-fluid">
    <a class="navbar-brand" href="/"><i class="bi bi-water"></i> Fish Logger</a>
    <div class="d-flex gap-3">
      <a href="/"        class="nav-link text-light {% if request.path == '/' %}fw-bold{% endif %}"><i class="bi bi-plus-circle"></i> Log</a>
      <a href="/history" class="nav-link text-light {% if '/history' in request.path %}fw-bold{% endif %}"><i class="bi bi-clock-history"></i> History</a>
      <a href="/analysis" class="nav-link text-light {% if '/analysis' in request.path %}fw-bold{% endif %}"><i class="bi bi-robot"></i> AI Analysis</a>
    </div>
  </div>
</nav>
<div class="container pb-5">
  {% block content %}{% endblock %}
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
