<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fish Logger{% block title %}{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="/static/css/app.css" rel="stylesheet">
  {% block head %}{% endblock %}
</head>
<body>
<nav class="navbar navbar-dark mb-4">
  <div class="container-fluid">
    <a class="navbar-brand" href="/"><i class="bi bi-water"></i> Fish Logger</a>
    <div class="d-flex gap-3">
      <a href="/"        class="nav-link text-light {% if request.path == '/' %}fw-bold{% endif %}"><i class="bi bi-plus-circle"></i> Log</a>
      <a href="/history" class="nav-link text-light {% if '/history' in request.path %}fw-bold{% endif %}"><i class="bi bi-clock-history"></i> History</a>
      <a href="/stats"   class="nav-link text-light {% if '/stats' in request.path %}fw-bold{% endif %}"><i class="bi bi-bar-chart-line"></i> Stats</a>
      <a href="/import"  class="nav-link text-light {% if '/import' in request.path %}fw-bold{% endif %}"><i class="bi bi-cloud-upload"></i> Import</a>
      <a href="/analysis" class="nav-link text-light {% if '/analysis' in request.path %}fw-bold{% endif %}"><i class="bi bi-robot"></i> AI Analysis</a>
      <a href="/tides"   class="nav-link text-light {% if '/tides' in request.path %}fw-bold{% endif %}"><i class="bi bi-water"></i> Tides</a>
    </div>
  </div>
</nav>
<div class="container pb-5">
  {% block content %}{% endblock %}
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
