<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Salinity Forecast — {{ name }}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body { background:#0a1628; color:#e6edf3; margin:0; }
    .bar { background:#0d2137; border-bottom:1px solid #30363d; padding:.6rem 1rem; }
    .title { color:#4dd0e1; font-size:.95rem; }
    #img { max-width:100%; max-height:78vh; border-radius:.375rem; }
    .ctrl { max-width:760px; margin:.5rem auto; }
  </style>
</head>
<body>
  <div class="bar d-flex align-items-center justify-content-between flex-wrap gap-2">
    <span class="title"><i class="bi bi-droplet-half me-1"></i> Salinity Forecast —
      <strong>{{ name }}</strong> <span id="region" class="text-info ms-1"></span></span>
    <a href="javascript:window.close()" class="btn btn-sm btn-outline-secondary">Close</a>
  </div>
  <div class="text-center p-3" id="body">
    <div class="spinner-border text-info mt-5"></div>
    <p class="text-muted mt-3">Loading NOAA NGOFS2 salinity forecast…</p>
  </div>

<script>
const STATION_ID = {{ station_id|tojson }};
let frames=[], idx=0, timer=null, playing=true;

(async function(){
  const body = document.getElementById('body');
  try {
    const d = await (await fetch(`/api/maps/${STATION_ID}`)).json();
    const sal = d.salinity || {};
    if (!sal.in_coverage) {
      body.innerHTML = `<div class="py-5 text-muted">
        <i class="bi bi-droplet" style="font-size:3rem;opacity:.4"></i>
        <p class="mt-3 mb-1 text-light fs-5">Salinity forecast covers Gulf of America bays</p>
        <p>NOAA's NGOFS2 model doesn't reach this station's area.</p></div>`;
      return;
    }
    document.getElementById('region').textContent = 'NGOFS2 · ' + (sal.region_label||'');
    frames = sal.frames || [];
    if (!frames.length) { body.innerHTML = `<div class="py-5 text-muted">${sal.error||'No salinity forecast available right now.'}</div>`; return; }
    frames.forEach(f => { const im=new Image(); im.src=f.url; });
    body.innerHTML = `
      <img id="img" src="${frames[0].url}" alt="salinity forecast">
      <div class="ctrl d-flex align-items-center gap-2">
        <button id="play" class="btn btn-sm btn-outline-info"><i class="bi bi-pause-fill"></i></button>
        <input id="slider" type="range" class="form-range flex-grow-1" min="0" max="${frames.length-1}" value="0">
        <span id="time" class="small text-info" style="min-width:130px;text-align:right">${frames[0].label}</span>
      </div>
      <div class="text-muted" style="font-size:.72rem">NOAA NGOFS2 surface-salinity forecast (PSU) · loops ~48 h ahead</div>`;
    const img=document.getElementById('img'), slider=document.getElementById('slider'),
          timeEl=document.getElementById('time'), play=document.getElementById('play');
    const show=i=>{idx=i;img.src=frames[i].url;slider.value=i;timeEl.textContent=frames[i].label;};
    function step(){ timer=setTimeout(()=>{ if(!playing)return; show(idx>=frames.length-1?0:idx+1); step(); }, idx>=frames.length-1?1400:550); }
    play.onclick=()=>{ playing=!playing; play.innerHTML=playing?'<i class="bi bi-pause-fill"></i>':'<i class="bi bi-play-fill"></i>'; if(playing){if(idx>=frames.length-1)idx=0;step();}else clearTimeout(timer); };
    slider.oninput=()=>{ playing=false; play.innerHTML='<i class="bi bi-play-fill"></i>'; clearTimeout(timer); show(parseInt(slider.value,10)); };
    step();
  } catch(e){ body.innerHTML = '<div class="py-5 text-muted">Could not load salinity forecast.</div>'; }
})();
</script>
</body>
</html>
