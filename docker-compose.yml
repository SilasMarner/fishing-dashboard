version: "3.8"

# Fishing Dashboard Stack
# Runs: fish-logger (Flask app + AI), Prometheus (metrics), Grafana (dashboards)
#
# Prerequisites:
#   1. Copy .env.example → .env and fill in your values
#   2. Create data directories (see README.md)
#   3. Provision Grafana datasource (grafana/provisioning/datasources/fish-sqlite.yaml)
#   4. Run the fishing_exporter as a systemd service on the host (see README.md)

services:

  # ─── Fish Logger ─────────────────────────────────────────────────────────────
  # Flask app: catch logging, AI analysis, Grafana embed page
  # NOTE: Production runs inside the loki-promtail Portainer stack (stack 27).
  # container_name removed to avoid stomping the production container if this
  # compose is run for dev/testing.
  fish-logger:
    image: fish-logger:latest
    build:
      context: ./fish_logger
    restart: unless-stopped
    environment:
      - TZ=America/Chicago
      - DB_PATH=/data/fish_log.db
      - PROMETHEUS_URL=http://prometheus:9090
      - AI_PROVIDER=${AI_PROVIDER:-groq}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - XAI_API_KEY=${XAI_API_KEY}
      # Handwritten-log import (/import): free OCR (tesseract/ocr.space) → Groq structuring,
      # or Claude vision. OCR_PROVIDER picks the default method shown in the dropdown.
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - IMPORT_MODEL=${IMPORT_MODEL:-claude-opus-4-8}
      - OCR_PROVIDER=${OCR_PROVIDER:-tesseract}
      - OCR_SPACE_API_KEY=${OCR_SPACE_API_KEY:-helloworld}
      - ANALYSIS_INTERVAL_HOURS=6
      - PORT=9879
    ports:
      - "9879:9879"
    volumes:
      - ${FISHING_DATA_DIR:-./data}:/data
    networks:
      - monitoring
      - grafana_net
    depends_on:
      - prometheus

  # ─── Prometheus ───────────────────────────────────────────────────────────────
  # Stores metrics from the fishing_exporter systemd service (port 9877)
  # NOTE: Production prometheus is in the loki-promtail Portainer stack (stack 27).
  # container_name and host port removed — dev-only; access via service name inside compose.
  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    user: "0:0"
    volumes:
      - ${PROMETHEUS_CONFIG_DIR:-./prometheus}:/etc/prometheus
      - ${PROMETHEUS_DATA_DIR:-./prometheus/data}:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.size=10GB
      - --web.enable-lifecycle
      - --web.cors.origin=.*
    networks:
      - monitoring
      - grafana_net

  # ─── Grafana ─────────────────────────────────────────────────────────────────
  # Dashboard UI — embeds the fish-logger /embed page in an iframe panel
  # NOTE: Production grafana is in the loki-promtail Portainer stack (stack 27).
  # container_name and host port removed — dev-only.
  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    user: "0:0"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
      - TZ=America/Chicago
      - GF_PANELS_DISABLE_SANITIZE_HTML=true
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_SECURITY_CONTENT_SECURITY_POLICY=false
      - GF_INSTALL_PLUGINS=frser-sqlite-datasource
    volumes:
      - ${GRAFANA_DATA_DIR:-./grafana/data}:/var/lib/grafana
      - ${GRAFANA_PROVISIONING_DIR:-./grafana/provisioning}:/etc/grafana/provisioning
      # Fish log SQLite DB — mounted read-only so Grafana can query it
      - ${FISHING_DATA_DIR:-./data}:/fishing:ro
    networks:
      - monitoring
    depends_on:
      - prometheus

networks:
  monitoring:
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: "9000"
  grafana_net:
    external: true
    name: loki-promtail_monitoring
