# Fishing Dashboard Stack
# Runs: fishing-exporter (Prometheus metrics), fish-logger (Flask app + AI),
#       Prometheus (metrics storage), Grafana (dashboards)
#
# Quick start: see QUICKSTART.md. In short —
#   1. cp .env.example .env and fill in your values
#   2. docker compose up -d
#   3. Import grafana/fishing-tides-solunar-dashboard.json into Grafana
#
# This is the self-contained, fresh-clone stack (its own Prometheus + Grafana).
# To integrate with an existing Prometheus/Grafana/Loki stack instead, use
# docker-compose.prod.yml — see its header comment.

services:

  # ─── Fishing & Tide Exporter ────────────────────────────────────────────────
  # Polls NOAA/NWS every 60s, exposes Prometheus metrics (:9877) and an
  # on-demand date-query API (:9878) used by the Grafana tide chart.
  fishing-exporter:
    image: fishing-exporter:latest
    build:
      context: ./fishing_exporter
    restart: unless-stopped
    environment:
      - TZ=America/Chicago
    ports:
      - "9877:9877"
      - "9878:9878"
    networks:
      - monitoring

  # ─── Fish Logger ─────────────────────────────────────────────────────────────
  # Flask app: catch logging, AI analysis, Grafana embed page
  fish-logger:
    image: fish-logger:latest
    build:
      context: ./fish_logger
    restart: unless-stopped
    environment:
      - TZ=America/Chicago
      - DB_PATH=/data/fish_log.db
      - PROMETHEUS_URL=http://prometheus:9090
      - EXPORTER_QUERY_URL=http://fishing-exporter:9878
      - AI_PROVIDER=${AI_PROVIDER:-groq}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - XAI_API_KEY=${XAI_API_KEY}
      # Handwritten-log import (/import): free OCR (tesseract/ocr.space) → Groq structuring,
      # or Claude vision. OCR_PROVIDER picks the default method shown in the dropdown.
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - IMPORT_MODEL=${IMPORT_MODEL:-claude-opus-4-8}
      - OCR_PROVIDER=${OCR_PROVIDER:-ocr_space}
      - OCR_SPACE_API_KEY=${OCR_SPACE_API_KEY:-helloworld}
      - ANALYSIS_INTERVAL_HOURS=6
      - PORT=9879
    ports:
      - "9879:9879"
    volumes:
      - ${FISHING_DATA_DIR:-./data}:/data
    networks:
      - monitoring
    depends_on:
      - prometheus
      - fishing-exporter

  # ─── Prometheus ───────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    user: "0:0"
    volumes:
      - ${PROMETHEUS_CONFIG_DIR:-./prometheus}:/etc/prometheus
      - ${PROMETHEUS_DATA_DIR:-./prometheus/data}:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.size=10GB
      - --web.enable-lifecycle
      - --web.cors.origin=.*
    ports:
      - "9090:9090"
    networks:
      - monitoring
    depends_on:
      - fishing-exporter

  # ─── Grafana ─────────────────────────────────────────────────────────────────
  # Dashboard UI — embeds the fish-logger /embed page in an iframe panel
  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    user: "0:0"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
      - TZ=America/Chicago
      - GF_PANELS_DISABLE_SANITIZE_HTML=true
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_SECURITY_CONTENT_SECURITY_POLICY=false
      - GF_INSTALL_PLUGINS=frser-sqlite-datasource
    volumes:
      - ${GRAFANA_DATA_DIR:-./grafana/data}:/var/lib/grafana
      - ${GRAFANA_PROVISIONING_DIR:-./grafana/provisioning}:/etc/grafana/provisioning
      # Fish log SQLite DB — mounted read-only so Grafana can query it
      - ${FISHING_DATA_DIR:-./data}:/fishing:ro
    ports:
      - "3000:3000"
    networks:
      - monitoring
    depends_on:
      - prometheus

networks:
  monitoring:
    driver: bridge
